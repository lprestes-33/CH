<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1a2e1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Escala CH — HBM/SM</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=Barlow:wght@300;400;500;600&display=swap');
:root{
  --bg: #0f160f;
  --panel: #162216;
  --card: #1c2b1c;
  --border: rgba(201, 168, 76, 0.2);
  --border-hover: rgba(201, 168, 76, 0.4);
  --gold: #c9a84c;
  --gold2: #e8c96a;
  --khaki: #9e9070;
  --paper: #f4efdf;
  --green: #1a2e1a;
  --green-light: #2a472a;
  --danger: #9c2b2b;
  --ok: #50a862;
  --info: #35659e;
  --exp: #1e5230; --sv: #1e3552; --sav: #4a3818; 
  --cch: #38244a; --paec: #1e4a4a; --via: #4a2424;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; font-family: 'Barlow', sans-serif; background: var(--bg); color: var(--paper); font-size: 14px; -webkit-font-smoothing: antialiased;}
body { display: grid; grid-template-rows: auto 1fr; grid-template-columns: 290px 1fr; overflow: hidden; min-height: 100vh; }

::-webkit-scrollbar { width: 7px; height: 7px; }
::-webkit-scrollbar-track { background: rgba(0,0,0,0.09); }
::-webkit-scrollbar-thumb { background: rgba(201, 168, 76, 0.2); border-radius: 6px;}
::-webkit-scrollbar-thumb:hover { background: rgba(201, 168, 76, 0.4); }

header { 
  grid-column: 1 / -1; 
  background: var(--green); 
  border-bottom: 3px solid var(--gold);
  padding: 16px 24px 13px 20px; 
  display: flex; 
  align-items: center; 
  gap: 18px;
  box-shadow: 0 4px 23px rgba(0,0,0,0.26);
  z-index: 10;
  position: sticky;
  top: 0;
}
.shield { 
  width: 48px; height: 58px; 
  background: linear-gradient(135deg, var(--gold2), var(--gold)); 
  flex-shrink: 0;
  clip-path: polygon(50% 0%, 100% 15%, 100% 75%, 50% 100%, 0% 75%, 0% 15%);
  display: flex; align-items: center; justify-content: center;
  font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 14px; color: var(--bg);
  box-shadow: 0 0 20px rgba(0,0,0,0.1), inset 0 0 10px rgba(0,0,0,0.16);
}
header h1 { 
  font-family: 'Barlow Condensed', sans-serif; font-size: 25px; font-weight: 700;
  letter-spacing: 2.5px; color: var(--gold2); text-transform: uppercase; text-shadow: 0 2px 4px rgba(0,0,0,0.3);
}
header p { font-size: 12px; color: var(--khaki); letter-spacing: 1px; margin-top: 3px; }
.hdr { margin-left: auto; display: flex; gap: 10px; flex-wrap: wrap; align-items: center;}

/* Layout */
aside { 
  background: var(--panel); 
  border-right: 1px solid var(--border);
  overflow-y: auto; display: flex; flex-direction: column; 
  box-shadow: 2px 0 16px rgba(0,0,0,0.14); z-index: 5;
  padding-top: 3px;
}
main { overflow: hidden; display: flex; flex-direction: column; min-width: 0; position: relative; }

/* Responsive! */
@media (max-width: 1050px) {
  body { grid-template-columns: 1fr; grid-template-rows: auto auto 1fr;}
  aside { max-height: none; min-width: 0; border-right: none; border-bottom: 2px solid var(--gold);}
  main { min-width: 0;}
}
@media (max-width: 700px) {
  html, body { font-size:12.5px;}
  header { flex-direction: column; align-items: flex-start; gap: 7px; padding: 13px 10px 12px 10px;}
  .shield { width: 37px; height: 44px; }
  .hdr { margin: 0; width: 100%; gap: 6px;}
}
@media (max-width: 520px) {
  html, body {font-size:11px;}
  header {padding: 9px 2px 7px 2px;}
  aside {box-shadow: none;}
  .empty-state { font-size: 11px; padding: 6px;}
  .modal {padding: 10px; width: 97vw;}
}

/* Melhor visual aside */
.sec { border-bottom: 1px solid var(--border); background: rgba(23,30,18,0.07);}
.sec-hd { 
  padding: 13.5px 16px; font-family: 'Barlow Condensed', sans-serif; font-size: 13px;
  font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--gold);
  display: flex; align-items: center; gap: 8px; cursor: pointer; border-radius: 5px 5px 0 0;
  background: rgba(201,168,76,0.032); transition: background 0.18s, color 0.22s; user-select: none;
}
.sec-hd:hover { background: rgba(201,168,76,0.11); color: var(--gold2);}
.sec-arr { margin-left: auto; transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); font-size: 11px;}
.sec-hd.open .sec-arr { transform: rotate(180deg);}
.sec-body { padding: 16px 16px 18px; display: flex; flex-direction: column; gap: 13px; transition: all 0.23s;}
.sec-body.hidden { display: none; }

label { font-size: 11.5px; letter-spacing: 0.5px; color: var(--khaki); margin-bottom: 5px; text-transform: uppercase; font-weight: 500;}
input, select { 
  width: 100%; background: rgba(0,0,0,0.28); border: 1px solid rgba(180,150,60,0.23);
  border-radius: 5px; color: var(--paper); font-family: 'Barlow', sans-serif; font-size: 13px;
  padding: 8.5px 10px; transition: all 0.18s; margin-bottom: 8px;
}
input:focus, select:focus { outline: 2px solid var(--gold2); border-color: var(--gold2); box-shadow: 0 0 0 2px rgba(201,168,76,0.17);}
select option { background: var(--panel); }
.r2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px;}

.btn { 
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  background: var(--gold); color: var(--bg); border: none; border-radius: 4px;
  font-family: 'Barlow Condensed', sans-serif; font-size: 13px; font-weight: 700;
  letter-spacing: 1.5px; text-transform: uppercase; padding: 8px 16px; cursor: pointer;
  transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1); width: 100%; box-shadow: 0 2px 7px rgba(0,0,0,0.09);
}
